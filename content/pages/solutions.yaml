ar:
  seo:
    title: "حلولنا"
    description: "حلول رقمية، وتقنية وابتكار، وربط الأعمال من AXYRA."
  hero:
    eyebrow: "حلولنا"
    title: "تقنية عملية، بكل بساطة."
    lead: "نصمّم ونبني ونشغّل منتجات رقمية تحل مشكلات حقيقية — بوضوح وموثوقية، وبالعربية والإنجليزية."
  areas:
    - title: "الحلول الرقمية"
      summary: "تطبيقات ومنتجات رقمية مصمّمة حول سير العمل الحقيقي، ومبنية لتكون موثوقة من اليوم الأول."
      details: "نحوّل الفكرة أو المشكلة اليومية إلى منتج يستخدمه الناس فعلًا: تطبيقات ويب وجوال وسطح مكتب بتصميم واضح ومصدر بيانات واحد."
      points:
        - "تطبيقات ويب وجوال وسطح مكتب"
        - "واجهات واضحة ثنائية اللغة (العربية والإنجليزية)"
        - "دعم وتطوير مستمر بعد الإطلاق"
    - title: "التقنية والابتكار"
      summary: "نوظّف التقنيات الحديثة — ومنها الذكاء الاصطناعي حيث يفيد فعلًا — لجعل العمل اليومي أبسط وأسرع وأدق."
      details: "الابتكار مفيد فقط عندما يوفّر الجهد. نستخدم الذكاء الاصطناعي والأدوات الحديثة حيث توفّر الوقت أو تقلّل الأخطاء، مع الحفاظ على تجربة بسيطة لمستخدميها."
      points:
        - "أتمتة ذكية داخل منتجات حقيقية"
        - "عمل يدوي أقل وأخطاء أقل"
        - "أنظمة سحابية متاحة دائمًا"
    - title: "ربط الأعمال"
      summary: "نربط الشركات بشركائها وعملائها عبر قنوات رقمية آمنة."
      details: "تنمو القيمة عندما يتواصل الأشخاص المناسبون. نبني الروابط بينهم — من السجلات الرقمية الموثّقة التي يثق بها الشركاء، إلى الرسائل الفورية التي تصل إلى العملاء حيث هم."
      points:
        - "مستندات رقمية موثّقة (مثل التحقق برمز QR)"
        - "رسائل وتذكيرات تصل فورًا"
        - "وصول مشترك وآمن للفرق والشركاء"
    - title: "التجارة الدولية"
    - title: "حلول التجارة العالمية"
  cta:
    title: "لديك تحدٍّ في ذهنك؟"
    lead: "أخبرنا بما يبطئ عملك، وسنخبرك بصدق إن كانت التقنية قادرة على المساعدة."
    button: "تحدّث معنا"
