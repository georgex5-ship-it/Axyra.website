        - "Clear, bilingual interfaces (Arabic and English)"
        - "Ongoing support and improvement after launch"
    - title: "Technology & Innovation"
      summary: "Applying modern technology — including AI where it genuinely helps — to make everyday work simpler, faster and more accurate."
      details: "Innovation is only useful when it removes effort. We use AI and modern tools where they save time or reduce errors — and keep the experience simple for the people using them."
      points:
