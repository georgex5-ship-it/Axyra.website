        - "Less manual work, fewer errors"
        - "Cloud-based, always-available systems"
    - title: "Business Connectivity"
      summary: "Connecting businesses, partners and customers through secure digital channels."
      details: "Value grows when the right people are connected. We build the links between them — from verified digital records that partners can trust, to instant messages that reach customers where they already are."
