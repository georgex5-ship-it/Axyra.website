      paragraphs:
        - "اسم AXYRA وشعارها، واسم Dr. Assistant وشعاره، ومحتوى هذا الموقع وتصميمه مملوكة لـ {company} ما لم يُذكر خلاف ذلك. لا يجوز نسخها أو إعادة استخدامها دون إذن كتابي منا."
    - heading: "روابط لمواقع أخرى"
      paragraphs:
        - "يحتوي هذا الموقع على روابط لمواقع أخرى، منها مواقع منتجاتنا. لسنا مسؤولين عن محتوى أو ممارسات المواقع التي لا نتحكم بها."
