- name: products
  label: Products
  label_singular: Product
  icon: inventory_2
  folder: content/products
  extension: yaml
  format: yaml
  create: true
  delete: true
  identifier_field: slug
  slug: '{{slug}}'
  summary: '{{slug}}'
  description: One entry = one product. New products get their own page automatically.
  fields:
  - name: slug
    label: Web address name
    widget: string
    required: true
    hint: Lowercase, no spaces, e.g. my-app → /products/my-app/
  - name: order
    label: Position in list (1 = first)
    widget: number
    value_type: int
    required: false
    default: 9
  - name: show
    label: Show this product
    widget: boolean
    required: false
    default: true
  - name: hasPage
    label: Has its own page
    widget: boolean
    required: false
    default: true
  - name: externalUrl
    label: Product website address
    widget: string
    required: false
    hint: e.g. https://… (for Dr. Assistant the address is set in ⚙️ Company settings)
  - name: externalUrlFromSettings
    label: Use address from settings (advanced)
    widget: string
    required: false
    hint: 'Only for Dr. Assistant: drAssistantUrl. Leave empty for other products.'
  - name: theme
    label: Colour theme
    widget: select
    required: false
    options:
    - label: AXYRA colours
      value: axyra
    - label: Dr. Assistant colours (sky → emerald)
      value: dr-assistant
    default: axyra
  - name: ogImage
    label: Sharing picture path (advanced)
    widget: string
    required: false
    hint: e.g. /og/dr-assistant-og.jpg (1200×630, in public/og/)
  - name: images
    label: Main images
    widget: object
    fields:
    - name: icon
      label: App icon (square)
      widget: image
      required: false
    - name: desktop
      label: Main screenshot (desktop)
      widget: image
      required: false
    - name: phone
      label: Phone screenshot (tall)
      widget: image
      required: false
  - name: sections
    label: Sections to show
    widget: object
    fields:
    - name: showcase
      label: Screenshot sections
      widget: boolean
      required: false
      default: true
    - name: features
