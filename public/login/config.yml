    - name: navy
      label: Midnight navy (dark backgrounds)
      widget: color
      required: false
      hint: From the logo.
    - name: linkLight
      label: Link colour — light theme
      widget: color
      required: false
      hint: Must stay dark enough to read on white (contrast 4.5:1 or more).
    - name: accentLight
      label: Accent text — light theme
      widget: color
      required: false
      hint: Must stay dark enough to read on white (contrast 4.5:1 or more).
    - name: linkDark
      label: Link colour — dark theme
      widget: color
      required: false
      hint: Must stay light enough to read on navy.
    - name: accentDark
      label: Accent text — dark theme
      widget: color
      required: false
      hint: Must stay light enough to read on navy.
