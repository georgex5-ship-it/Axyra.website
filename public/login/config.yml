# AXYRA admin panel configuration (Sveltia CMS). Generated — edit with care.
# Every form below edits one file in /content. Images are saved in src/assets/uploads.
backend:
  name: github
  repo: Georgex5/axyra-website
  branch: main
  auth_methods:
  - token
  skip_ci: false
  commit_messages:
    create: 'Content: create {{collection}} “{{slug}}”'
    update: 'Content: update {{collection}} “{{slug}}”'
    delete: 'Content: delete {{collection}} “{{slug}}”'
    uploadMedia: 'Content: upload “{{path}}”'
    deleteMedia: 'Content: delete “{{path}}”'
app_title: AXYRA Admin
site_url: https://axyra.web.app
logo:
  src: /favicon.svg
media_folder: src/assets/uploads
public_folder: /src/assets/uploads
editor:
  preview: false
collections:
- name: pages
  label: Pages & settings
  icon: description
  files:
  - name: settings
    label: ⚙️ Company settings
    file: content/settings.yaml
    fields:
    - name: company
      label: Company
      widget: object
      fields:
      - name: name
        label: Company name
        widget: string
        required: false
        hint: Always AXYRA, in capitals.
      - name: slogan
        label: Official slogan
        widget: string
        required: false
        hint: Do not change the wording.
      - name: legalName
        label: Registered legal name
        widget: string
        required: false
        hint: 'Text that still says [[EDIT: …]] is a placeholder and is hidden on the live site.'
      - name: foundedYear
        label: Year founded
        widget: string
        required: false
        hint: 'Text that still says [[EDIT: …]] is a placeholder and is hidden on the live site.'
    - name: contact
      label: Contact details
      widget: object
      fields:
      - name: email
        label: Email
        widget: string
        required: false
        hint: 'Text that still says [[EDIT: …]] is a placeholder and is hidden on the live site.'
      - name: phone
        label: Phone (with country code)
        widget: string
        required: false
        hint: 'Text that still says [[EDIT: …]] is a placeholder and is hidden on the live site.'
      - name: whatsapp
        label: WhatsApp (digits only, with country code)
        widget: string
        required: false
        hint: 'Example: 970590000000'
      - name: city
        label: City (English)
        widget: string
        required: false
      - name: cityAr
        label: City (Arabic)
        widget: string
        required: false
      - name: country
        label: Country (English)
        widget: string
        required: false
      - name: countryAr
        label: Country (Arabic)
        widget: string
        required: false
      - name: address
        label: Street address (English, optional)
        widget: string
        required: false
      - name: addressAr
        label: Street address (Arabic, optional)
        widget: string
        required: false
      - name: mapsUrl
        label: Google Maps link (optional)
        widget: string
        required: false
    - name: social
      label: Social media links
      widget: object
      fields:
      - name: linkedin
        label: LinkedIn
        widget: string
        required: false
        hint: Full link starting with https://. Leave the placeholder to hide the icon.
      - name: instagram
        label: Instagram
        widget: string
        required: false
        hint: Full link starting with https://. Leave the placeholder to hide the icon.
      - name: facebook
        label: Facebook
        widget: string
        required: false
        hint: Full link starting with https://. Leave the placeholder to hide the icon.
      - name: x
        label: X (Twitter)
        widget: string
        required: false
        hint: Full link starting with https://. Leave the placeholder to hide the icon.
      - name: youtube
        label: YouTube
        widget: string
        required: false
        hint: Full link starting with https://. Leave the placeholder to hide the icon.
      - name: tiktok
        label: TikTok
        widget: string
        required: false
        hint: Full link starting with https://. Leave the placeholder to hide the icon.
      collapsed: true
    - name: products
      label: Product links
      widget: object
      fields:
      - name: drAssistantUrl
        label: Dr. Assistant website / app address
        widget: string
        required: false
        hint: Used by every “Visit Dr. Assistant” button.
    - name: site
      label: Website address & Google
      widget: object
      fields:
      - name: url
        label: Website address
        widget: string
        required: false
        hint: e.g. https://axyra.web.app — change to your own domain when you have one.
      - name: allowIndexing
        label: Allow Google to list the site
        widget: boolean
        required: false
        default: false
        hint: Keep OFF until your real domain is connected.
      - name: highlightPlaceholdersInPreview
        label: Highlight placeholders in local preview
        widget: boolean
        required: false
        default: true
      collapsed: true
    - name: languages
      label: Languages
      widget: object
      fields:
      - name: english
        label: English
        widget: boolean
        required: false
        default: true
      - name: arabic
        label: Arabic (العربية)
        widget: boolean
        required: false
        default: true
      collapsed: true
    - name: pages
      label: Pages to publish (on = visible)
      widget: object
      fields:
      - name: about
        label: About
        widget: boolean
        required: false
        default: true
      - name: solutions
        label: Solutions
        widget: boolean
        required: false
        default: true
      - name: products
        label: Products
        widget: boolean
        required: false
        default: true
      - name: contact
        label: Contact
        widget: boolean
        required: false
        default: true
      - name: privacy
        label: Privacy Policy
        widget: boolean
        required: false
        default: true
      - name: terms
        label: Terms of Use
        widget: boolean
        required: false
        default: true
      - name: news
        label: Insights / News
        widget: boolean
        required: false
        default: false
      - name: careers
        label: Careers
        widget: boolean
        required: false
        default: false
      - name: partners
        label: Partners
        widget: boolean
        required: false
        default: false
    - name: contactForm
      label: Contact form
      widget: object
      fields:
      - name: web3formsAccessKey
        label: Web3Forms access key
        widget: string
        required: false
        hint: Get a free key at web3forms.com. Until then the form opens the visitor’s email app (if an email is set above).
    - name: analytics
      label: Analytics
      widget: object
      fields:
      - name: provider
        label: Provider
        widget: select
        options:
        - none
        - cloudflare
        default: none
        required: false
      - name: cloudflareToken
        label: Cloudflare Web Analytics token
        widget: string
        required: false
      collapsed: true
  - name: theme
    label: 🎨 Brand colours
    file: content/theme.yaml
