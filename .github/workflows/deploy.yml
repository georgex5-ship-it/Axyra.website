# Publishes the website to Firebase Hosting (https://axyra.web.app) whenever
# content changes — including every save in the admin panel (/login).
# Keyless: GitHub proves its identity to Google (Workload Identity Federation).
# Only this repository may use the "github-deployer" account, which can only
# publish the axyra-website project. No passwords or keys are stored anywhere.
name: Publish website

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sveltia-cms-publish]   # "Publish" button in the admin panel
  workflow_dispatch:               # manual run from the GitHub "Actions" tab

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check content files
        run: node scripts/check-content.mjs || true
      - run: npm run build
      - name: Sign in to Google (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1041828139681/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@axyra-website.iam.gserviceaccount.com
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@15.36.0 deploy --only hosting --project axyra-website --non-interactive
