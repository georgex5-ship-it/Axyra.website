<title>استبيان الأطباء · Dr. Assistant</title>
<meta name="robots" content="noindex, nofollow">

<style>
/* Layout: AXYRA navy brand band (both logos) above a sticky view bar; one column of question cards; big tap targets. Palette: AXYRA navy + violet. */
:root{
  --bg:#f6f6fb; --surface:#ffffff; --ink:#0a0b1e; --muted:#5d6078; --line:#e2e2ee;
  --brand:#5b3fd9; --brand-ink:#ffffff; --brand-soft:#efeafe; --blue:#2f7bff;
  --bar:#5b3fd9; --track:#ececf4; --warn:#b4432a; --warn-soft:#fcebe5; --good:#0e8a68; --good-soft:#e2f4ee;
  --f-body:"Cairo Variable","Cairo","Segoe UI",Tahoma,sans-serif; --f-head:"Cairo Variable","Cairo","Segoe UI",Tahoma,sans-serif;
  --navy:#0a0b1e; --navy-2:#14162f; --on-navy:#f4f5fb; --on-navy-muted:#a8abc8; --grad:linear-gradient(90deg,#8b4df2,#2f7bff 50%,#22d0f5);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0b1e; --surface:#14152c; --ink:#ececf6; --muted:#a2a4c0; --line:#2a2c4a;
  --brand:#8b6cf5; --brand-ink:#0a0b1e; --brand-soft:#221b48; --blue:#6ea3ff;
  --bar:#8b6cf5; --track:#22243f; --warn:#f08a6a; --warn-soft:#3a2019; --good:#3ccf9f; --good-soft:#12302a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0a0b1e; --surface:#14152c; --ink:#ececf6; --muted:#a2a4c0; --line:#2a2c4a;
  --brand:#8b6cf5; --brand-ink:#0a0b1e; --brand-soft:#221b48; --blue:#6ea3ff;
  --bar:#8b6cf5; --track:#22243f; --warn:#f08a6a; --warn-soft:#3a2019; --good:#3ccf9f; --good-soft:#12302a; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:120px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl;margin:0}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;font-weight:700}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.brandband{background:radial-gradient(120% 140% at 85% 0%,#1c1847 0%,var(--navy) 60%);color:var(--on-navy)}
.brandband .wrap{padding-block:18px 14px;display:flex;flex-direction:column;gap:14px}
.logos{display:flex;align-items:center;justify-content:space-between;gap:16px}
.axyra-logo{height:30px;width:auto;display:block}
.axyra-logo svg{height:100%;width:auto;display:block}
.dr-wrap{font-size:30px;line-height:1}
h1{font-size:22px;color:var(--on-navy)}
.lede{margin:2px 0 0;color:var(--on-navy-muted);font-size:14px}
.who{font-size:12px;color:var(--on-navy-muted)} .who a{color:var(--on-navy)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--navy-2)}
header.top::after{content:"";display:block;height:2px;background:var(--grad)}
nav.views{display:flex;gap:2px;overflow-x:auto}
nav.views a{padding:11px 12px 9px;color:var(--on-navy-muted);text-decoration:none;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
nav.views a[aria-current="page"]{color:var(--on-navy);border-bottom-color:#8b6cf5}
nav.views .n{background:rgba(255,255,255,.12);color:var(--on-navy)}
.n{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--track);font-size:12px;margin-inline-start:4px;text-align:center}
.prog{height:3px;background:var(--track)} .prog i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}
main .wrap{padding-block:16px 130px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.intro{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:14px;color:var(--muted)}
.intro b{color:var(--ink)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--brand)}
.sec h2{font-size:17px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sn{background:var(--ink);color:var(--surface);border-radius:7px;min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;padding:0 6px}
.sec.self{border-style:dashed}
.q{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sec .q:first-of-type{border-top:0}
.qt{font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.qn{color:var(--brand);font-variant-numeric:tabular-nums;min-width:20px}
.sugg{font-size:11px;font-weight:700;background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:1px 8px}
.why{font-size:13px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:22px;padding:7px 14px 7px 12px;cursor:pointer;min-height:40px;text-align:start}
.opt::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex:none;box-sizing:border-box}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);font-weight:600}
.opt[aria-pressed="true"]::before{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 2px var(--surface)}
.multi-tag{font-size:12px;color:var(--muted);font-weight:400}
.other-in{max-width:420px}
.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;max-width:520px}
.scale button{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.scale button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.scale-ends{display:flex;justify-content:space-between;max-width:520px;font-size:12px;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=email],input[type=password],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
input[type=number],input[type=date],input[type=tel]{max-width:220px}
textarea{min-height:80px;resize:vertical}
.demo{background:var(--brand-soft);border-color:transparent}
.demo .script{font-size:16px;margin:8px 0 12px}
.demo-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr{background:#fff;border-radius:10px;padding:8px;width:132px;height:132px;flex:none}
.qr svg{width:100%;height:100%;display:block}
.qr path{fill:#0a0b1e}
.link-btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:var(--brand-ink);text-decoration:none;border-radius:10px;padding:10px 16px;font-weight:700}
.url{direction:ltr;font-size:13px;color:var(--muted);user-select:all;word-break:break-all}
.savebar{position:fixed;bottom:0;left:0;right:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{padding-block:10px;display:flex;gap:8px;align-items:center}
.status{font-size:13px;color:var(--muted);margin-inline-end:auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.status.err{color:var(--warn)} .status.ok{color:var(--good)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px}
.notice.ok{background:var(--good-soft);color:var(--good)}
/* results */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{width:auto;min-width:150px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-family:var(--f-head);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:13px;color:var(--muted)}
.chart h3{font-size:15px;margin-bottom:2px}
.chart .sub{font-size:12px;color:var(--muted);margin:0 0 10px}
.hb{display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:13.5px}
.hb .lab{min-width:0;overflow-wrap:anywhere}
.hb .trk{height:14px;background:var(--track);border-radius:0 4px 4px 0;position:relative;overflow:hidden}
.hb .trk i{position:absolute;inset:0 0 0 auto;background:var(--bar);border-radius:4px 0 0 4px;min-width:2px}
.hb .val{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;font-size:12.5px}
.hb .val b{color:var(--ink);font-weight:600}
.hb .hit{display:contents}
.hb .hit:hover .trk i{filter:brightness(1.12)}
.cols{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;align-items:end;height:140px;border-bottom:1px solid var(--line);padding-top:16px}
.cols .c{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.cols .c i{display:block;width:70%;background:var(--bar);border-radius:4px 4px 0 0;min-height:0}
.cols .c em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:2px}
.cols-x{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;text-align:center;font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.others{margin-top:10px;font-size:13px;color:var(--muted)}
.others b{color:var(--ink);font-weight:600}
.quotes{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.quotes li{border-inline-start:3px solid var(--brand);padding:2px 10px;font-size:14px}
.quotes small{color:var(--muted)}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;border-radius:7px;padding:5px 9px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:32px 14px}
.empty h2{color:var(--ink);font-size:17px;margin-bottom:6px}
/* copies */
.resp{display:flex;flex-direction:column;gap:6px}
.resp .head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.resp .head b{font-size:16px}
.meta{color:var(--muted);font-size:13px}
.pill{display:inline-block;border-radius:12px;padding:1px 9px;font-size:12px;background:var(--track)}
.pill.hot{background:var(--good-soft);color:var(--good);font-weight:600}
.copy .a{color:var(--ink);font-weight:600}
.copy .a.none{color:var(--muted);font-weight:400}
.copy .ans-opts{display:flex;flex-wrap:wrap;gap:6px}
.copy .ans-opts span{border:1.5px solid var(--line);border-radius:16px;padding:2px 10px;font-size:13px;color:var(--muted)}
.copy .ans-opts span.on{border-color:var(--brand);background:var(--brand-soft);color:var(--ink);font-weight:600}
/* login */
.login{max-width:380px;margin:40px auto;display:flex;flex-direction:column;gap:10px}
.dl-logo{display:inline-flex;flex-direction:column;line-height:1;font-family:"Plus Jakarta Sans Variable","Plus Jakarta Sans",system-ui,sans-serif;direction:ltr}
.dl-name{font-weight:800;letter-spacing:-.035em;white-space:nowrap}
.dl-nm{font-weight:600;letter-spacing:-.03em;background-image:linear-gradient(90deg,#38BDF8,#34D399);-webkit-background-clip:text;background-clip:text;color:transparent}
.dl-row{display:flex;align-items:center;width:100%;margin:.14em 0 .18em}
.dl-s1{width:1.578em;height:.9em;overflow:visible;flex:none}
.dl-s2{width:.63em;height:.9em;overflow:visible;flex:none}
.dl-ln{flex:1;height:.055em;border-radius:9px;background:linear-gradient(90deg,#38BDF8,#34D399)}
.dl-sl{font-size:.2em;font-weight:600;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.dl-sl b{color:#34D399;font-weight:600}
.gate{max-width:420px;margin:28px auto;display:flex;flex-direction:column;gap:10px}
@media (max-width:420px){.dr-wrap{font-size:24px}.axyra-logo{height:24px}}
@media print{
  header.top,.savebar,.no-print,.brandband .lede,.who{display:none!important}
  .brandband{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}
  .card{border:1px solid #ccc;break-inside:avoid}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
