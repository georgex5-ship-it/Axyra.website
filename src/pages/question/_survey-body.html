/* ---- Firestore REST helpers (axyra.web.app/question) ---- */
const KEY_LS = "axyra-survey-key", CACHE_LS = "axyra-survey-cache";
function fsEnc(v){
  if(v === null || v === undefined) return { nullValue: null };
  if(Array.isArray(v)) return { arrayValue: { values: v.map(fsEnc) } };
  if(typeof v === "number") return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if(typeof v === "boolean") return { booleanValue: v };
  if(typeof v === "object") return { mapValue: { fields: Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fsEnc(x)])) } };
  return { stringValue: String(v) };
}
function fsDec(x){
  if(!x || typeof x !== "object") return null;
  if("stringValue" in x) return x.stringValue;
  if("integerValue" in x) return Number(x.integerValue);
  if("doubleValue" in x) return x.doubleValue;
  if("booleanValue" in x) return x.booleanValue;
  if("arrayValue" in x) return (x.arrayValue.values || []).map(fsDec);
  if("mapValue" in x) return Object.fromEntries(Object.entries(x.mapValue.fields || {}).map(([k, v]) => [k, fsDec(v)]));
  if("timestampValue" in x) return x.timestampValue;
  return null;
}
async function fsFetch(path, opts = {}){
  const r = await fetch(FS_BASE + path, { ...opts, headers: { "Content-Type": "application/json" } });
  if(r.ok){ const t = await r.text(); return t ? JSON.parse(t) : null; }
  let reason = "", msg = "";
  try{ const j = await r.json(); reason = (j.error?.details || []).map(d => d.reason).filter(Boolean)[0] || j.error?.status || ""; msg = j.error?.message || ""; }catch(e){}
  const err = new Error(reason || ("HTTP " + r.status)); err.status = r.status; err.reason = reason; err.msg = msg; throw err;
}
function classify(e){
  if(e.reason === "SERVICE_DISABLED" || e.status === 404 || e.reason === "NOT_FOUND" || e.reason === "FAILED_PRECONDITION") return "setup";
  // Only a rules rejection means a wrong passphrase. Anything else (network, blocked request, unknown 403) is not the user's fault.
  if(e.status === 403 && /insufficient permissions/i.test(e.msg || "")) return "badkey";
  return "local";
}
function newId(){ const a = crypto.getRandomValues(new Uint8Array(8)); return Date.now().toString(36) + [...a].map(x => (x % 36).toString(36)).join(""); }
function normKey(k){ return String(k || "").replace(/[\u0660-\u0669]/g, c => c.charCodeAt(0) - 0x660).replace(/[\u06F0-\u06F9]/g, c => c.charCodeAt(0) - 0x6F0).replace(/\s+/g, "").toLowerCase(); }
function getKey(){ try{ return normKey(localStorage.getItem(KEY_LS)); }catch(e){ return ""; } }

const Stores = {
  async claude(){
    const db = window.claude?.use ? await claude.use("db") : null;
    if(!db) return null;
    const col = db.collection(COLLECTION);
    return {
      pendingCount: () => 0,
      subscribe(cb, err){ return col.onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), err); },
      async save(id, body){ const ref = id ? col.doc(id) : col.doc(); await ref.set(body); return ref.id; },
      remove(id){ return col.doc(id).delete(); },
    };
  },
  async rest(){
    const key = getKey();
    if(!key) return "gate";
    const k = encodeURIComponent(key);
    let cache = lg(CACHE_LS) || { docs: {}, pending: {} };
    const persist = () => ls(CACHE_LS, cache);
    let listener = null, syncing = null;
    const emit = () => listener && listener(Object.entries(cache.docs).map(([id, b]) => ({ id, ...b })));
    async function pull(){
      const out = {}; let tok = "";
      do{
        const j = await fsFetch(`/${k}/responses?pageSize=300${tok ? "&pageToken=" + encodeURIComponent(tok) : ""}`);
        for(const d of (j?.documents || [])) out[d.name.split("/").pop()] = fsDec({ mapValue: { fields: d.fields || {} } });
        tok = j?.nextPageToken || "";
      } while(tok);
      return out;
    }
    function sync(){
      if(syncing) return syncing;
      syncing = (async () => {
        try{
          for(const [id, op] of Object.entries(cache.pending)){
            if(op === "delete" || !cache.docs[id]) await fsFetch(`/${k}/responses/${id}`, { method: "DELETE" });
            else await fsFetch(`/${k}/responses/${id}`, { method: "PATCH", body: JSON.stringify({ fields: fsEnc(cache.docs[id]).mapValue.fields }) });
            delete cache.pending[id]; persist();
          }
          cache.docs = await pull(); persist(); storeState = "ready";
        }catch(e){ storeState = classify(e); }
        finally{ syncing = null; emit(); }
      })();
      return syncing;
    }
    return {
      sync,
      pendingCount: () => Object.keys(cache.pending).length,
      subscribe(cb){ listener = cb; emit(); sync(); return () => { listener = null; }; },
      async save(id, body){ id = id || newId(); cache.docs[id] = body; cache.pending[id] = "save"; persist(); emit(); await sync(); return id; },
      async remove(id){ delete cache.docs[id]; cache.pending[id] = "delete"; persist(); emit(); await sync(); },
    };
  },
};

    const id = await store.save(cur.id, { a: clean, createdAt: cur.createdAt || now, updatedAt: now, v: 3 });
    cur.id = id; cur.createdAt = cur.createdAt || now; dirty = false; ls(DRAFT, cur);
    status(store.pendingCount() ? "حُفظ على هذا الجهاز ✓ · سيُرفع عند توفر الاتصال" : `تم الحفظ ✓ ${cur.a.doc_name || ""}`, "ok");
  }catch(e){ status("تعذّر الحفظ: " + (e?.code === "permission_denied" || e?.code === "permission-denied" ? "لا توجد صلاحية." : (e?.message || "حاول مرة أخرى.")), "err"); }
  finally{ b.disabled = false; }
}

/* ================= ROUTING & EVENTS ================= */
function route(){
  const v = (location.hash || "#form").slice(1).split("-")[0];
  const view = ["form","results","copies"].includes(v) ? v : "form";
  ["form","results","copies"].forEach(x => $("#v-" + x).hidden = x !== view);
  $$("nav.views a").forEach(a => a.dataset.view === view ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  $("#savebar").hidden = view !== "form"; $("#progWrap").style.visibility = view === "form" ? "visible" : "hidden";
  if(view === "results") renderResults();
  if(view === "copies") renderCopies();
  if(view !== "form" && store && store.sync) store.sync();
}
window.addEventListener("hashchange", route);

document.addEventListener("click", async e => {
  if(e.target.id === "lockBtn"){ e.preventDefault(); lockDevice(); return; }
  const b = e.target.closest("button"); if(!b) return;
  if(b.classList.contains("opt")){
    const q = QBY[b.dataset.q], v = b.dataset.v;
    if(q.type === "multi"){ const s = new Set(cur.a[q.id] || []); s.has(v) ? s.delete(v) : s.add(v); cur.a[q.id] = [...s]; }
    else cur.a[q.id] = cur.a[q.id] === v ? null : v;
    const sel = [].concat(cur.a[q.id] || []);
    $$(`.opt[data-q="${q.id}"]`).forEach(o => o.setAttribute("aria-pressed", sel.includes(o.dataset.v)));
    const oi = $(`#f-${q.id}_other`); if(oi){ oi.hidden = !sel.includes(OTHER); if(!oi.hidden && v === OTHER) oi.focus(); }
    refreshConditions(); touch(); return;
  }
  if(b.dataset.n){ const q = b.dataset.q, n = Number(b.dataset.n); cur.a[q] = cur.a[q] === n ? null : n;
    $$(`[data-q="${q}"][data-n]`).forEach(x => x.setAttribute("aria-pressed", Number(x.dataset.n) === cur.a[q])); touch(); return; }
  if(b.id === "saveBtn"){ save(); return; }
  if(b.id === "newBtn"){
    if(dirty && !b.dataset.sure){ b.dataset.sure = 1; b.textContent = "تأكيد: امسح وابدأ؟"; setTimeout(() => { delete b.dataset.sure; b.textContent = "جديد"; }, 4000); return; }
    delete b.dataset.sure; b.textContent = "جديد"; cur = blank(); dirty = false; ls(DRAFT); renderForm(); scrollTo(0, 0); status("استبيان جديد"); return;
  }
  if(b.dataset.copy){ openCopy = b.dataset.copy; renderCopies(); scrollTo(0, 0); return; }
  if(b.dataset.back){ openCopy = null; renderCopies(); return; }
  if(b.dataset.print){ window.print(); return; }
  if(b.dataset.edit){ const r = saved.find(x => x.id === b.dataset.edit); if(!r) return;
    cur = { id: r.id, a: structuredClone(r.a || {}), createdAt: r.createdAt }; dirty = false; ls(DRAFT, cur); openCopy = null;
    renderForm(); location.hash = "#form"; scrollTo(0, 0); status(`تعديل: ${r.a.doc_name || "طبيب"}`); return; }
  if(b.dataset.del){ $("#cf-" + b.dataset.del).hidden = false; return; }
  if(b.dataset.delno){ $("#cf-" + b.dataset.delno).hidden = true; return; }
  if(b.dataset.delyes){ try{ await store.remove(b.dataset.delyes); if(cur.id === b.dataset.delyes) cur.id = null; }catch(err){ alertRow(b, "تعذّر الحذف."); } return; }
  if(b.id === "csvBtn"){ exportCsv(); return; }
});
function alertRow(b, t){ const s = document.createElement("span"); s.className = "status err"; s.textContent = t; b.parentElement.append(s); }
document.addEventListener("input", e => {
  const el = e.target;
  if(el.id === "suggToggle"){ showSugg = el.checked; try{ localStorage.setItem("axyra-survey-sugg", showSugg ? "1" : "0"); }catch(x){} renderForm(); return; }
  if(el.id === "fCity"){ fCity = el.value; renderResults(); return; }
  if(el.id === "fSpec"){ fSpec = el.value; renderResults(); return; }
  if(el.dataset.t){ const q = QBY[el.dataset.t]; cur.a[el.dataset.t] = q && q.type === "number" ? (el.value === "" ? null : Number(el.value)) : el.value; touch(); }
});
// hover tooltip for chart marks
const tip = $("#tip");
document.addEventListener("pointermove", e => {
  const t = e.target.closest("[data-tip]");
  if(!t){ tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  const w = tip.offsetWidth; tip.style.left = Math.min(innerWidth - w - 8, Math.max(8, e.clientX - w / 2)) + "px"; tip.style.top = (e.clientY - 36) + "px";
});

/* ================= BOOT ================= */
const d = lg(DRAFT); if(d && d.a){ cur = d; dirty = true; }
renderForm(); route();
if(d && d.a){ const [x, t] = progress(); status(`استُعيدت المسودة · ${x}/${t}`); }
(async () => {
  let s = null;
  try{ s = await Stores[BACKEND](); }catch(e){ s = null; }
  if(s === "gate"){ showGate(); return; }
  store = s; storeState = s ? (BACKEND === "rest" ? "loading" : "ready") : "none";
  if(!s){ route(); return; }
  if(BACKEND === "rest") $("#who").innerHTML = `<a href="#" id="lockBtn">قفل هذا الجهاز</a>`;
  const timer = setTimeout(() => { if(storeState === "loading") status("الاتصال بطيء…", "err"); }, 10000);
  s.subscribe(list => {
    clearTimeout(timer);
    if(storeState === "badkey"){ showGate("كلمة السر لم تعد صحيحة. أدخلها من جديد."); return; }
    saved = list; $("#nRes").textContent = saved.length;
    if(!$("#v-results").hidden) renderResults();
    if(!$("#v-copies").hidden) renderCopies();
  }, () => { clearTimeout(timer); status("تعذّر تحميل الاستبيانات المحفوظة.", "err"); });
  if(BACKEND === "rest"){
    addEventListener("online", () => s.sync());
    setInterval(() => { if(!document.hidden && navigator.onLine) s.sync(); }, 60000);
  }
})();
</script>
